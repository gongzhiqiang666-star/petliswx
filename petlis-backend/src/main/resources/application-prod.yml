spring:
  # 数据源配置(生产环境)
  datasource:
    url: ${DB_URL:jdbc:mysql://prod-db-server:3306/laboklin?useUnicode=true&characterEncoding=utf8mb4&useSSL=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:petlis}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 10
      maximum-pool-size: 50
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  # JPA配置
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true

# 日志配置(生产环境)
logging:
  level:
    root: WARN
    com.petlis: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
  file:
    name: /var/log/petlis-backend/application.log
    max-size: 500MB
    max-history: 60

# Swagger配置(生产环境关闭)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 文件上传路径(生产环境)
app:
  file:
    upload-path: /data/petlis/uploads

  # JWT配置(生产环境从环境变量读取)
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:604800000}

  # 微信配置(生产环境从环境变量读取)
  wechat:
    appid: ${WECHAT_APPID}
    secret: ${WECHAT_SECRET:}
